name: 실행

on:
  workflow_dispatch:
    inputs:
      target:
        description: "실행 대상 선택"
        required: true
        default: "hidi"
        type: choice
        options:
          - hidi
          - mentee

jobs:
  run_cron:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm install

      - name: job
        run: pnpm run start:${{ inputs.target }}
